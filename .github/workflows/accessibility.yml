name: Accessibility Audit

# The complete suite is split into four groups balanced from measured CI durations.
# Each group uses a separate macOS runner and one simulator. A stalled test cannot
# hold the remaining groups open, and every group retains its raw build/test logs.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'accessibility')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify complete suite coverage and plan groups
        id: groups
        run: |
          audit_matrix=$(python3 Scripts/accessibility-groups.py --matrix)
          echo "matrix=$audit_matrix" >> "$GITHUB_OUTPUT"
          python3 Scripts/accessibility-groups.py --check

  audit_group:
    name: audit (${{ matrix.group }})
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: macos-26
    # Build/test steps have their own bounds; leave time here for diagnostic upload.
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Prepare the Xcode project
        id: project
        uses: ./.github/actions/xcode-project

      - name: Build UI tests
        timeout-minutes: 40
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlassesUITests \
            -destination "platform=iOS Simulator,id=${{ steps.project.outputs.simulator-udid }}" \
            -derivedDataPath AccessibilityDerivedData \
            -jobs 2 \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-checkouts \
            -onlyUsePackageVersionsFromResolvedFile \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee xcodebuild-build.log \
            | grep --line-buffered -E '^Build|^SwiftCompile|^CompileC|error:|\*\* BUILD' \
            || { tail -160 xcodebuild-build.log; exit 1; }

      - name: Run accessibility group
        timeout-minutes: 35
        env:
          AUDIT_GROUP: ${{ matrix.group }}
        run: |
          set -o pipefail
          python3 Scripts/accessibility-groups.py --group "$AUDIT_GROUP" -- \
            xcodebuild test-without-building \
            -project OpenGlasses.xcodeproj \
            -scheme OpenGlassesUITests \
            -destination "platform=iOS Simulator,id=${{ steps.project.outputs.simulator-udid }}" \
            -derivedDataPath AccessibilityDerivedData \
            -resultBundlePath "AccessibilityResults-$AUDIT_GROUP.xcresult" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath .spm-checkouts \
            -onlyUsePackageVersionsFromResolvedFile \
            SWIFT_EMIT_LOC_STRINGS=NO \
            2>&1 | tee xcodebuild-tests.log \
            | grep --line-buffered -E 'Test Suite|Test Case.*(started|passed|failed)|a11y-audit|error:|\*\* TEST' \
            || { tail -160 xcodebuild-tests.log; exit 1; }

      - name: Upload results and unfiltered logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AccessibilityResults-${{ matrix.group }}
          path: |
            AccessibilityResults-${{ matrix.group }}.xcresult
            xcodebuild-build.log
            xcodebuild-tests.log
          retention-days: 7

  # Keep the existing single "audit" check for branch protection and PR review.
  audit:
    needs: [plan, audit_group]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require every group to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          AUDIT_RESULT: ${{ needs.audit_group.result }}
        run: |
          test "$PLAN_RESULT" = success && test "$AUDIT_RESULT" = success
