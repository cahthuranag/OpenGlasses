name: ManualLibraryBenchmark
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  ManualLibraryBenchmark:
    type: application
    platform: iOS
    sources:
      - App.swift
      - Stubs.swift
      - ../../OpenGlasses/Sources/Services/RAG/DocumentStore.swift
      - ../../OpenGlasses/Sources/Services/RAG/DocumentReconstructor.swift
      - ../../OpenGlasses/Sources/Services/RAG/DocumentChunker.swift
      - ../../OpenGlasses/Sources/Services/RAG/Embedder.swift
      - ../../OpenGlasses/Sources/Services/RAG/EmbeddingBackend.swift
      - ../../OpenGlasses/Sources/Services/RAG/EmbeddingVersion.swift
      - ../../OpenGlasses/Sources/Services/RAG/PassageLocation.swift
      - ../../OpenGlasses/Sources/Services/Vault/VaultDocumentExtractor.swift
      - ../../OpenGlasses/Sources/Services/Vault/ManualStructure.swift
      - ../../OpenGlasses/Sources/Services/Vault/ScannedPageReader.swift
      - ../../OpenGlasses/Sources/Services/Vault/VaultRetriever.swift
      - ../../OpenGlasses/Sources/Services/Vault/ClauseReference.swift
      - ../../OpenGlasses/Sources/Services/Vault/CodeTokenizer.swift
      - ../../OpenGlasses/Sources/Services/Vault/LexicalSupport.swift
      - ../../OpenGlasses/Sources/Services/Vault/PageReference.swift
      - ../../OpenGlasses/Sources/Services/Vault/DocumentEditions.swift
      - ../../OpenGlasses/Sources/Services/Vault/BackOfBookIndex.swift
      - ../../OpenGlasses/Sources/Services/Vault/ManualPassageLimit.swift
      - ../../OpenGlasses/Sources/Services/Vault/TableExtractor.swift
      - ../../OpenGlasses/Sources/Services/Vault/TableChecks.swift
      - ../../OpenGlasses/Sources/Services/Vault/TableRowPassage.swift
      - ../../OpenGlasses/Sources/Services/Vault/TableReference.swift
      - ../../OpenGlasses/Sources/Services/Vault/PDFTableReader.swift
      - ../../OpenGlasses/Sources/Services/Vault/RecognisedTable.swift
      - ../../OpenGlasses/Sources/Services/Vault/CellCertainty.swift
      - ../../OpenGlasses/Sources/Services/Vault/PictureRegion.swift
      - ../../OpenGlasses/Sources/Services/Vault/PictureTableReading.swift
      - ../../OpenGlasses/Sources/Services/Vault/VisionTableReader.swift
      - ../../OpenGlasses/Sources/Services/Accessibility/OCRService.swift
      - ../../OpenGlasses/Sources/Services/Reading/BookFileExtractor.swift
      - ../../OpenGlasses/Sources/Services/Security/SecretPatterns.swift
      - ../../OpenGlasses/Sources/Services/Privacy/StoreProtection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openglasses.manualbenchmark
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: '5.0'
